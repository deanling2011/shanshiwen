<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>山师文集 · 历史上的今天</title>
<meta name="description" content="每日文集归档，按年月日浏览历年今日内容">
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #161922;
    --card: #1b1f2a;
    --card-hover: #222837;
    --border: #2a3040;
    --text: #e8eaf0;
    --text-dim: #9aa3b2;
    --accent: #d4a25a;
    --accent-soft: rgba(212, 162, 90, 0.12);
    --red: #e05252;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0 20px;
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .brand .dot { color: var(--accent); }
  .brand small { display:block; font-size: 11px; color: var(--text-dim); font-weight: 400; letter-spacing: 2px; }

  /* 站点切换导航 */
  .switcher {
    display: flex; align-items: center; gap: 3px;
    padding: 3px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,.28);
    flex-shrink: 0;
    animation: swIn .5s ease both;
  }
  @keyframes swIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .switcher .sw {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 600; letter-spacing: .5px;
    color: var(--text-dim); text-decoration: none; cursor: pointer;
    transition: color .2s, background .2s, box-shadow .2s, transform .2s;
    white-space: nowrap; position: relative;
  }
  .switcher .sw:hover { color: var(--text); }
  .switcher .sw:not(.active):hover { transform: translateY(-1px); }
  .switcher .sw.active {
    background: linear-gradient(135deg, var(--accent), #e6bb7a);
    color: #1a1408; cursor: default;
    box-shadow: 0 2px 10px rgba(212,162,90,.42);
  }
  .switcher .sw .arrow {
    font-size: 11px; line-height: 1; opacity: 0;
    transform: translate(-3px, 3px); transition: all .2s ease;
  }
  .switcher .sw:not(.active):hover .arrow { opacity: 1; transform: translate(0, 0); }
  @media (max-width: 420px) {
    .switcher .sw { padding: 5px 10px; font-size: 12px; gap: 3px; }
    .brand { font-size: 16px; }
  }

  /* 今日卡片 */
  .today-card {
    background: linear-gradient(135deg, #1e2433, #161922);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .today-card::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: var(--accent-soft); filter: blur(30px);
  }
  .today-label { font-size: 12px; color: var(--accent); letter-spacing: 3px; margin-bottom: 6px; }
  .today-date { font-size: 26px; font-weight: 700; }
  .today-meta { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .today-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 9px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
    border: 1px solid var(--border); color: var(--text);
    background: var(--card); transition: all .15s;
  }
  .btn:hover { background: var(--card-hover); }
  .btn.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }

  /* 内容区 */
  .section-title { font-size: 15px; font-weight: 700; margin: 22px 0 12px; color: var(--text); }
  .section-title .hint { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: 8px; }

  /* 年月导航 */
  .nav-month {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .nav-month::-webkit-scrollbar { display: none; }
  .nav-month button {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-dim); font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: all .15s;
  }
  .nav-month button.active { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }

  /* 星期表头 */
  .week-head {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 6px;
  }
  .week-head span {
    text-align: center; font-size: 11px; color: var(--text-dim); padding: 3px 0;
  }

  .day-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  .day-cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; background: var(--card); border: 1px solid var(--border);
    cursor: pointer; transition: all .12s; position: relative;
  }
  .day-cell:hover { background: var(--card-hover); }
  .day-cell .d { font-size: 16px; font-weight: 600; line-height: 1.15; }
  .day-cell .lunar { font-size: 10px; color: var(--text-dim); margin-top: 3px; line-height: 1.2; }
  .day-cell .lunar.fest { color: #e0a06a; }
  .day-cell .lunar.fest-red { color: var(--red); }
  .day-cell .term-pill {
    font-size: 10px; color: #6fce9d; background: #1d3a2e;
    padding: 1px 5px; border-radius: 8px; margin-top: 3px; line-height: 1.3;
  }
  .day-cell .holiday-tag {
    position: absolute; top: 2px; left: 2px;
    font-size: 9px; line-height: 1; padding: 1px 3px; border-radius: 4px;
  }
  .day-cell .holiday-tag.rest { color: #85b7eb; background: #17324a; }
  .day-cell .holiday-tag.work { color: #f0a06a; background: #3a2418; }
  .day-cell .dot-ind {
    position: absolute; top: 6px; right: 6px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .day-cell.empty:hover { background: transparent; }
  .day-cell.no-data { opacity: .35; cursor: default; }
  /* 今天：淡金细圈，只作"今天在哪"的定位参考，不抢视觉 */
  .day-cell.today { border-color: rgba(212,162,90,.42); }
  .day-cell.today .d { color: var(--accent); }
  /* 选中：当前正在看的那天，实心高亮。写在 .today 之后，同时命中时以选中为准 */
  .day-cell.selected {
    border-color: var(--accent);
    background: rgba(212,162,90,.13);
    box-shadow: 0 0 0 1.5px var(--accent), 0 4px 14px rgba(212,162,90,.20);
  }
  .day-cell.selected .d { color: var(--accent); }

  /* 文集展示 */
  .collection { display: none; }
  .collection.show { display: block; }
  .coll-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .coll-title { font-size: 18px; font-weight: 700; }
  .coll-back { font-size: 13px; color: var(--accent); cursor: pointer; }
  .coll-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: -4px 0 16px; }
  .coll-img-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer;
    border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft);
    transition: all .15s;
  }
  .coll-img-btn:hover { background: var(--accent); color: #1a1408; }
  .coll-img-btn.disabled { opacity: .4; cursor: default; pointer-events: none; }
  .year-group { margin-bottom: 20px; }
  .year-tag {
    display: inline-block; padding: 3px 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
    background: var(--accent-soft); color: var(--accent); margin-bottom: 10px;
  }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .item .idx { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
  .item .txt { font-size: 15px; white-space: pre-wrap; word-break: break-word; }

  .loading { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 14px; }
  .empty-tip { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 14px; }

  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 40px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>

  function lYearDays(y){
    var i, sum = 348;
    for (i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0;
    return sum + leapDays(y);
  }
  function leapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
  function leapDays(y){ if (leapMonth(y)) return (LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29; return 0; }
  function monthDays(y, m){ return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29; }

  function solar2lunar(y, m, d){
    var offset = Math.floor((Date.UTC(y, m-1, d) - Date.UTC(1900, 0, 31)) / 86400000);
    var i, temp = 0, leap;
    for (i = 1900; i < 2101 && offset > 0; i++){ temp = lYearDays(i); offset -= temp; }
    if (offset < 0){ offset += temp; i--; }
    var year = i;
    leap = leapMonth(i);
    var isLeap = false;
    for (i = 1; i < 13 && offset > 0; i++){
      if (leap > 0 && i === (leap+1) && !isLeap){ --i; isLeap = true; temp = leapDays(year); }
      else { temp = monthDays(year, i); }
      if (isLeap && i === (leap+1)) isLeap = false;
      offset -= temp;
    }
    if (offset === 0 && leap > 0 && i === leap+1){ if (isLeap){ isLeap = false; } else { isLeap = true; --i; } }
    if (offset < 0){ offset += temp; --i; }
    return { lm: i, ld: offset + 1, leap: isLeap };
  }

  function lunarLabel(lm, ld, leap){
    if (ld === 1){
      return (leap ? '闰' : '') + LUNAR_MONTHS[lm];
    }
    return LUNAR_DAY[ld-1];
  }

  function getTermName(y, m, d){
    var arr = TERMS_DATA[y-1900];
    if (!arr) return null;
    for (var n = 0; n < 24; n++){
      if (Math.floor(n/2) + 1 === m && arr[n] === d) return TERM_NAMES[n];
    }
    return null;
  }

  function getFestival(y, m, d, l){
    var key = l.lm + '-' + l.ld;
    if (LUNAR_FEST[key]) return LUNAR_FEST[key];
    if (l.lm === 12 && l.ld === monthDays(y, 12)) return '除夕';
    var skey = m + '-' + d;
    if (SOLAR_FEST[skey]) return SOLAR_FEST[skey];
    return null;
  }

  function getHoliday(y, m, d){
    var yt = HOLIDAY[y];
    if (!yt) return null;
    return yt[m + '-' + d] || null;
  }

  function cellSub(y, m, d, l){
    var fest = getFestival(y, m, d, l);
    if (fest){
      var red = (fest === '春节' || fest === '国庆节' || fest === '元旦');
      return { text: fest, cls: 'lunar ' + (red ? 'fest-red' : 'fest') };
    }
    var term = getTermName(y, m, d);
    if (term) return { text: term, cls: 'term-pill' };
    return { text: lunarLabel(l.lm, l.ld, l.leap), cls: 'lunar' };
  }

  function loadJSON(path, cb){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', path, true);
    xhr.onload = function(){
      if (xhr.status >= 200 && xhr.status < 300){
        try { cb(JSON.parse(xhr.responseText)); }
        catch(e){ cb(null); }
      } else cb(null);
    };
    xhr.onerror = function(){ cb(null); };
    xhr.send();
  }

  function buildWeekHead(){
    var wh = document.getElementById('weekHead');
    wh.innerHTML = '';
    var days = ['一','二','三','四','五','六','日'];
    for (var i = 0; i < 7; i++){
      var s = document.createElement('span');
      s.textContent = days[i];
      wh.appendChild(s);
    }
  }

  function buildMonthNav(){
    var nav = document.getElementById('navMonth');
    nav.innerHTML = '';
    var names = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    var t = new Date();
    for (var i=0;i<12;i++){
      (function(m){
        var b = document.createElement('button');
        b.textContent = names[m];
        if (m === curMonth) b.className = 'active';
        b.onclick = function(){ curMonth = m; buildMonthNav(); renderGrid(); };
        nav.appendChild(b);
      })(i);
    }
    // 将当前月按钮滚动到可视区域中间
    var active = nav.querySelector('button.active');
    if (active) {
      var target = active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2;
      nav.scrollLeft = Math.max(0, target);
    }
  }

          cell.appendChild(dot);
        }

        var h = getHoliday(year, curMonth+1, day);
        if (h){
          var tag = document.createElement('span');
          tag.className = 'holiday-tag ' + (h === '休' ? 'rest' : 'work');
          tag.textContent = h;
          cell.appendChild(tag);
        }

        if (isCurMonth && day === t.getDate()){
          cell.classList.add('today');
        }
        cell.setAttribute('data-md', md);
        if (md === curSelected) cell.classList.add('selected');
        if (has){
          cell.onclick = function(){ showCollection(md); };
        }
        grid.appendChild(cell);
      })(d);
    }
  }

  function syncSelection(){
    var cells = document.getElementById('dayGrid').children;
    for (var i = 0; i < cells.length; i++){
      var md = cells[i].getAttribute('data-md');
      cells[i].classList.toggle('selected', !!md && md === curSelected);
    }
  }

  function showCollection(md){
    curSelected = md;
    syncSelection();
    var coll = document.getElementById('collection');
    coll.classList.add('show');
    document.getElementById('collTitle').textContent = md.replace('-','月') + '日 · 历年文集';
    // 图片版按钮：指向该日期的总览图（已为全部历史日期补全）
    var imgBtn = document.getElementById('collImg');
    imgBtn.href = imgUrl(md);
    imgBtn.classList.remove('disabled');
    var body = document.getElementById('collBody');
    body.innerHTML = '<div class="loading">加载中…</div>';
    // 不再强制 window.scrollTo(top:0)：点日期时页面停在原处，交给金圈做反馈

    loadJSON(DATA_BASE + md + '.json', function(data){
      if (!data || data.length === 0){
        body.innerHTML = '<div class="empty-tip">这一天暂无内容</div>';
        imgBtn.classList.add('disabled');
        return;
      }
      var html = '';
      var total = 0;
      data.forEach(function(g){
        html += '<div class="year-group"><span class="year-tag">' + g.year + ' 年</span>';
        g.items.forEach(function(txt, i){
          total++;
          html += '<div class="item"><div class="idx">#' + total + '</div>'
                + '<div class="txt">' + escapeHtml(txt) + '</div></div>';
        });
        html += '</div>';
      });
      body.innerHTML = html;
    });

    document.getElementById('collBack').onclick = function(){
      curSelected = null;
      syncSelection();
      coll.classList.remove('show');
      window.scrollTo({top:0, behavior:'smooth'});
    };
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  init();
})();
</script>
</body>
</html>
