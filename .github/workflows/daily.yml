name: Daily Archive

on:
  schedule:
    # 每天 UTC 16:25 = 北京时间 00:25
    - cron: '25 16 * * *'
  workflow_dispatch: {}   # 支持手动触发
  push:
    paths: ['.github/workflows/daily.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai   # 保证 datetime.now() 使用北京时间，生成正确的日期图片
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install pillow openpyxl

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build daily archive & image
        run: |
          # 行货字体路径适配：Noto CJK 在 Linux 上的路径
          python - <<'PYEOF'
          import os, shutil
          # 将 Noto Sans CJK 映射到脚本期望的 msyh 路径
          src_reg = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          src_bold = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
          if os.path.exists(src_reg):
              os.makedirs("fonts", exist_ok=True)
              shutil.copy(src_reg, "fonts/msyh.ttc")
              shutil.copy(src_bold, "fonts/msyhbd.ttc")
          PYEOF

          # 若 fonts/ 存在则优先使用本地字体
          python build_daily.py

      - name: Push to PushDeer
        env:
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
        run: |
          python push_daily.py "$PUSHDEER_KEY"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ img/ || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "daily archive $(date -u -d '+8 hours' '+%Y-%m-%d')"
            git push
          fi
